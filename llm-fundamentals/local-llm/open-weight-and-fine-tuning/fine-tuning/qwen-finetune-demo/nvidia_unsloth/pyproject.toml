[project]
name = "qwen-finetune-nvidia-unsloth"
version = "0.1.0"
description = "NVIDIA / Colab LoRA training for the Harbor Labs Qwen 3.5 demo"
requires-python = ">=3.11"
# If uv cannot resolve Unsloth on your platform, follow the install block on
# https://docs.unsloth.ai/models/qwen-3.5 and run train_and_export.py there.
dependencies = [
    "unsloth",
    "datasets>=3.0.0",
    "trl>=0.14.0",
    "transformers>=4.45.0",
]

[tool.uv]
package = false
