[project]
name = "local-llm"
version = "0.1.0"
description = "Toy language model from scratch: BPE tokenizer, attention, training and generation"
requires-python = ">=3.11,<3.13"
dependencies = [
    # PyTorch stopped shipping Intel-Mac wheels after 2.2.2, so pin it there only.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # torch 2.2.x was built against NumPy 1.x.
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv]
package = false
