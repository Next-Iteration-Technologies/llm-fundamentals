[project]
name = "ai-application-architecture"
version = "0.1.0"
description = "AI Application Architecture: the LoDA chatbot, built one step at a time"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.120", "httpx", "fastapi>=0.115", "uvicorn>=0.32", "mcp>=2.3,<3", "pyjwt>=2.8"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
