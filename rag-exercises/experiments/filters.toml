# Phase 5 (LAB chapter 6): two documents disagree. The old remote-work policy (HR-REM-01 v2024, still in the library)
# says up to 2 days a week from home, the current one (revised 2026-03-01) says 3. Which one does the answer use?
# We change: search filters and a "prefer the newest" rule. We keep: the best setup so far (embedding phase, else retrieval).
phase = "filters"
only = ["contoso"]        # D&D has no dates, countries or askers
from = ["embedding", "retrieval"]

[[rows]]
name = "no-filters"

[[rows]]
name = "asker"            # each question asked as its golden-set asker: only what that role may see (E6)
filters = { asker = "golden" }

[[rows]]
name = "country"          # a question that names a country only searches that country's documents (and "All")
filters = { country = "question" }

[[rows]]
name = "after-2026"       # only documents dated 2026 or later
filters = { after = "2026-01-01" }

[[rows]]
name = "prefer-newest"    # the same chunks are sent, newest first: when sources disagree, the newer one comes first
filters = { prefer_newest = true }

[[rows]]
name = "asker+prefer-newest"
filters = { asker = "golden", prefer_newest = true }

[[watch]]                 # printed for every row: which of the two comes first for this question
question = "g10"
old = "policies/archive/HR-REM-01_2024.md"
new = "policies/HR-REM-01.md"
say = "2 days (HR-REM-01 v2024) or 3 days (HR-REM-01, 2026)?"
