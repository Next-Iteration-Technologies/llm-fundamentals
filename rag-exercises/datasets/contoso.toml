# The Contoso pack of E1-E11: Contoso Water's HR, client and service policies, minutes, mail, a price list, a delivery
# log, tickets and a Jira snapshot. All fictional.
title = "Contoso Water pack"
docs = "../contoso-pack"                 # relative to this file
include = ["policies/**/*.md", "minutes/*.md", "onedrive/**/*.md", "mail/*.eml",
           "price-list.csv", "logs/*.log", "tickets/tickets.json", "jira/snapshot-2026-10-06.json"]
questions = ["../contoso-pack/golden-set.json"]
format = "contoso"                       # golden-set.json: expected_ids graded 3/2/1, resolved through corpus_index
corpus_index = "../contoso-pack/corpus-index.json"
chunking = "structure"                   # rag.py's own loaders: one section, row, message, log line, ticket per chunk
subject = "our policies, minutes or mail"
refusal = "I don't find this in our policies, minutes or mail"

[gold]
# corpus_index quotes (lab_match) are found in their file; some are widened to the whole record they belong to.
expand = { ".csv" = "line", ".log" = "line", ".json" = "object" }
